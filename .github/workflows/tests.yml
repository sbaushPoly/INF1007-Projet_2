  name: Tests
  on: [push]  

  jobs:
    test:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-python@v7
          with:
            python-version: "3.14"
        - run: pip install -r requirements.txt
        - run: sudo apt-get update && sudo apt-get install -y python3-tk #Code par IA
        - run: python -m pytest -v